version: '3.8'

services:
  triage-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: misinfo-triage-backend:latest
    container_name: misinfo-triage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data/audit_log.jsonl:/app/data/audit_log.jsonl
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
